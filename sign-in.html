<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Sign in to ATLAS</title>
  <link rel="stylesheet" href="/auth-style.css">
  <script src="/auth-config.js" defer></script>
  <script src="/auth.js?v=2002a1d" defer></script>
</head>
<body class="startup">
  <main class="welcome onboarding">
    <img src="/atlas-logo.svg" alt="Atlas" class="welcome-logo">
    <p class="eyebrow">ATLAS</p>
    <h1 id="title">Sign in to Atlas.</h1>
    <p id="description">Use your verified email or Google account.</p>
    <p class="error" role="alert" id="error"></p>
    <section id="identity">
      <button type="button" id="google" class="secondary">Continue with Google</button>
      <form id="email-form">
        <label for="email">Email address</label>
        <input id="email" type="email" autocomplete="email" required>
        <button type="submit" id="email-button">Continue with email <span aria-hidden="true">↗</span></button>
      </form>
    </section>
    <section id="new-user" hidden>
      <form id="new-user-form">
        <div class="name-fields">
          <label for="first-name">First name<input id="first-name" autocomplete="given-name" required></label>
          <label for="last-name">Last name<input id="last-name" autocomplete="family-name" required></label>
        </div>
        <button type="submit">Create account and send code <span aria-hidden="true">↗</span></button>
      </form>
    </section>
    <section id="verify" hidden>
      <p id="sent-message"></p>
      <form id="code-form">
        <label for="code">Email code</label>
        <input id="code" inputmode="numeric" autocomplete="one-time-code" required>
        <button type="submit">Verify and continue <span aria-hidden="true">↗</span></button>
      </form>
      <button type="button" class="secondary" id="email-link">Send me a sign-in link</button>
    </section>
    <section id="ready" hidden>
      <p id="ready-message"></p>
      <button type="button" id="continue">Continue to Atlas <span aria-hidden="true">↗</span></button>
    </section>
    <button type="button" class="back" id="back" hidden>Use another email</button>
    <p class="legal"><a href="/privacy.html">Privacy</a> · <a href="/terms.html">Terms</a></p>
  </main>
</body>
</html>
